<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f5f1e8" />
<title>词表 · EngHub</title>
<script>try{var t=localStorage.getItem('engapp-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css" />
<style>
.wl-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 14px}
.wl-back{color:var(--dim);font-size:.9rem}
.wl-back:hover{color:var(--ink)}
.wl-title{font-family:var(--serif);font-size:1.18rem;font-weight:700}
.mode-toggle{display:flex;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px}
.mode-toggle a{padding:7px 15px;border-radius:7px;font-weight:700;font-size:.88rem;color:var(--dim)}
.mode-toggle a.active{background:var(--brand);color:var(--on-brand)}
.wl-search{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 16px;color:var(--ink);outline:none;font-size:.9rem;min-width:170px;transition:border-color .16s}
.wl-search:focus{border-color:var(--ink)}
.wl{display:grid;grid-template-columns:200px 1fr;gap:24px;padding-bottom:50px}
.wl-side{position:sticky;top:calc(var(--nav-h) + 12px);align-self:start;display:flex;flex-direction:column;gap:2px}
.wl-side .st{font-size:.78rem;color:var(--dim);font-weight:700;padding:0 10px 8px}
.wl-side a{padding:9px 12px;border-radius:10px;color:var(--dim);font-size:.92rem;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.wl-side a:hover{background:var(--bg);color:var(--ink)}
.wl-side a.active{background:color-mix(in srgb,var(--brand) 12%,var(--card));color:var(--brand);font-weight:700}
.wl-side a .c{opacity:.6;font-size:.8rem}
.wl-count{color:var(--dim);font-size:.85rem;margin-bottom:12px}
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;border-left:3px solid transparent}
.wcard.known{border-left-color:var(--brand)}
.wcard.unknown{border-left-color:var(--bad)}
.wcard .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.wcard .w{font-family:Georgia,"Times New Roman",serif;font-size:1.18rem;font-weight:700}
.wcard .sp{cursor:pointer;color:var(--brand);background:none;border:0;font-size:.95rem;flex:none}
.wcard .ph{color:var(--dim);font-size:.8rem;font-style:italic;margin-top:2px}
.wcard .mn{color:var(--ink);font-size:.9rem;margin-top:8px;opacity:.92}
.wcard .tag{font-size:.7rem;color:var(--dim);margin-top:8px}
.wl-empty{padding:50px 20px;text-align:center;color:var(--dim)}
@media(max-width:820px){.wl{grid-template-columns:1fr}.wl-side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}.wl-side .st{display:none}.wl-side a{flex:none;border:1px solid var(--line)}}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="index.html"><span class="m"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span> EngHub</a>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">首页</a>
    <a href="dashboard.html?exam=cet4" data-exam="cet4">四级</a>
    <a href="dashboard.html?exam=cet6" data-exam="cet6">六级</a>
    <a href="dashboard.html?exam=ielts" data-exam="ielts">雅思</a>
  </nav>
  <div class="nav-right">
    <button class="btn-login">登录</button>
  </div>
  <button class="nav-toggle" id="navToggle">☰</button>
</header>

<div class="wrap">
  <div class="wl-top">
    <a class="wl-back" id="back" href="dashboard.html">← 返回</a>
    <span class="wl-title" id="title">词汇</span>
    <div class="mode-toggle">
      <a class="active">列表</a>
      <a id="toStudy" href="study.html">逐词背</a>
    </div>
    <input class="wl-search" id="search" placeholder="搜单词 / 释义…" />
  </div>

  <div class="wl" id="wl">
    <aside class="wl-side" id="side"></aside>
    <main class="wl-main">
      <div class="wl-count" id="count"></div>
      <div class="wcards" id="cards"></div>
    </main>
  </div>
  <div class="wl-empty" id="empty" style="display:none">该考试的词库还没上线,先试试四级 / 六级吧～</div>
</div>

<script>
const NAMES={cet4:'四级',cet6:'六级',ielts:'雅思'};
const params=new URLSearchParams(location.search);
const exam=NAMES[params.get('exam')]?params.get('exam'):'cet6';
const $=id=>document.getElementById(id);
$('back').href='dashboard.html?exam='+exam;
$('toStudy').href='study.html?exam='+exam;
$('title').textContent=NAMES[exam]+' · 词汇';

let DECK=[], cur='全部', kw='', results={};
try{results=JSON.parse(localStorage.getItem('study-'+exam+'-results')||'{}');}catch(e){}

const sc=document.createElement('script');
sc.src='data/'+exam+'.js';
sc.onload=()=>{ DECK=window.DECK||[]; if(!DECK.length){showEmpty();return;} render(); };
sc.onerror=showEmpty;
document.head.appendChild(sc);

function showEmpty(){ $('wl').style.display='none'; $('empty').style.display='block'; }
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function play(t){const a=new Audio('https://dict.youdao.com/dictvoice?type=2&audio='+encodeURIComponent(t));a.play().catch(()=>{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u);}});}

function units(){ const m={}; for(const d of DECK){ m[d.u]=(m[d.u]||0)+1; } return m; }
function renderSide(){
  const m=units(); const side=$('side');
  let html='<div class="st">单元 / 分组</div>';
  html+='<a data-u="全部" class="'+(cur==='全部'?'active':'')+'">全部 <span class="c">'+DECK.length+'</span></a>';
  for(const u of Object.keys(m)) html+='<a data-u="'+esc(u)+'" class="'+(cur===u?'active':'')+'">'+esc(u)+' <span class="c">'+m[u]+'</span></a>';
  side.innerHTML=html;
}
function list(){
  let arr=DECK.filter(d=>cur==='全部'||d.u===cur);
  if(kw){const k=kw.toLowerCase(); arr=arr.filter(d=>(d.w+' '+d.mn).toLowerCase().includes(k));}
  return arr;
}
function render(){
  renderSide();
  const arr=list();
  $('count').textContent='共 '+arr.length+' 词'+(cur!=='全部'?'('+cur+')':'');
  $('cards').innerHTML=arr.map(d=>{
    const st=results[d.w]; const cls=st==='known'?' known':(st==='unknown'?' unknown':'');
    const badge=st==='known'?'<span class="tag" style="color:var(--brand)">✓ 认识</span>':(st==='unknown'?'<span class="tag" style="color:var(--bad)">✗ 生词</span>':'');
    return '<div class="wcard'+cls+'"><div class="top"><span class="w">'+esc(d.w)+'</span><button class="sp" data-say="'+esc(d.w)+'">🔊</button></div>'+
      (d.ph?'<div class="ph">/'+esc(String(d.ph).replace(/^\/|\/$/g,""))+'/'+(d.pos?' '+esc(d.pos):'')+'</div>':'')+
      '<div class="mn">'+esc(d.mn)+'</div>'+badge+'</div>';
  }).join('');
}
$('side').addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;cur=a.dataset.u;render();});
$('cards').addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)play(b.getAttribute('data-say'));});
$('search').addEventListener('input',()=>{kw=$('search').value.trim();render();});
</script>
<script src="assets/app.js"></script>
</body>
</html>
