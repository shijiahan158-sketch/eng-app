<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<title>错题本 · EngHub</title>
<script>try{var t=localStorage.getItem('engapp-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css" />
<style>
  .mk-wrap{max-width:880px;margin:0 auto;padding:24px clamp(16px,4vw,24px) 60px}
  .mk-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .mk-head h1{font-size:clamp(1.4rem,3.4vw,2rem);font-weight:800}.mk-head .sub{color:var(--dim);margin-top:4px}
  .mk-card{background:var(--card);border:1px solid var(--line);border-left:4px solid #ef4444;border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
  .mk-card .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--dim);font-size:.78rem;margin-bottom:8px}
  .mk-card .q{font-weight:600;line-height:1.6}
  .mk-card .ans{margin-top:8px;font-size:.9rem}
  .mk-card .ans .ok{color:#16a34a;font-weight:700}.mk-card .ans .no{color:#ef4444;font-weight:700}
  .mk-tag{font-size:.72rem;font-weight:800;color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--card));padding:2px 9px;border-radius:999px}
  .mk-del{border:0;background:none;color:var(--dim);cursor:pointer;font-weight:700}.mk-del:hover{color:#ef4444}
  .mk-empty{text-align:center;color:var(--dim);padding:46px 20px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
  .mk-clear{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:10px;padding:7px 14px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="index.html"><span class="m">📚</span> EngHub</a>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">首页</a>
    <a href="dashboard.html?exam=cet4" data-exam="cet4">四级</a>
    <a href="dashboard.html?exam=cet6" data-exam="cet6">六级</a>
    <a href="dashboard.html?exam=ielts" data-exam="ielts">雅思</a>
  </nav>
  <div class="nav-right">
    <div class="nav-search">🔍 <input placeholder="搜单词 / 题目…" /></div>
    <button class="btn-login">登录</button>
  </div>
  <button class="nav-toggle" id="navToggle">☰</button>
</header>

<div class="mk-wrap">
  <div class="mk-head">
    <div><h1>❌ 错题本</h1><p class="sub">做题时答错的题会自动收进这里 —— 登录后云端保存。</p></div>
    <div style="display:flex;gap:10px;align-items:center"><span class="badge" id="mkCount"></span><button class="mk-clear" id="clearBtn">清空</button></div>
  </div>
  <div id="list"></div>
</div>

<footer class="foot">EngHub · 错题本</footer>
<script src="assets/app.js"></script>
<script src="assets/cloud-auth.js"></script>
<script>
(function(){
  var KEY="engapp-mistakes";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ return []; } }
  function save(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); if(window.CloudAuth&&CloudAuth.isLoggedIn()) CloudAuth.syncUp(); }
  function fmt(ts){ var d=new Date(ts); return (d.getMonth()+1)+"月"+d.getDate()+"日"; }
  var listEl=document.getElementById("list"), cntEl=document.getElementById("mkCount");
  function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function render(){
    var arr=load(); cntEl.textContent=arr.length+" 题";
    if(!arr.length){ listEl.innerHTML='<div class="mk-empty">还没有错题 —— 去题库做几道阅读题吧 📖</div>'; return; }
    listEl.innerHTML=arr.map(function(m){
      return '<div class="mk-card"><div class="meta"><span><span class="mk-tag">'+esc(m.type||"题目")+'</span> '+esc(m.title||"")+' · '+fmt(m.ts)+'</span><button class="mk-del" data-id="'+m.id+'">删除</button></div>'+
        '<div class="q">'+esc(m.q)+'</div>'+
        '<div class="ans">正确答案：<span class="ok">'+esc(m.correct)+'</span>'+(m.your?('　你的：<span class="no">'+esc(m.your)+'</span>'):'　<span class="no">（未作答）</span>')+'</div></div>';
    }).join("");
    listEl.querySelectorAll(".mk-del").forEach(function(b){ b.onclick=function(){ save(load().filter(function(x){return String(x.id)!==b.dataset.id;})); render(); }; });
  }
  document.getElementById("clearBtn").onclick=function(){ if(confirm("清空所有错题？")){ save([]); render(); } };
  if(window.CloudAuth) CloudAuth.onLogin=function(){ render(); };
  render(); setTimeout(render,1200);
})();
</script>
</body>
</html>
