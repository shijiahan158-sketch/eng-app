<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f5f1e8" />
<title>学习报告 · EngHub</title>
<script>try{var t=localStorage.getItem('engapp-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css" />
<style>
  .rp-wrap{max-width:880px;margin:0 auto;padding:24px clamp(16px,4vw,24px) 60px}
  .rp-head h1{font-family:var(--serif);font-size:clamp(1.4rem,3.4vw,2rem);font-weight:700}
  .rp-head .sub{color:var(--dim);margin-top:4px}
  .rp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
  .rp-card h3{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:1.02rem;font-weight:700;margin-bottom:14px}
  .rp-card h3 svg{color:var(--brand);flex:none}
  .rp-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .rp-stat{text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--card) 55%,var(--bg))}
  .rp-stat b{display:block;font-family:var(--serif);font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
  .rp-stat span{font-size:.74rem;color:var(--dim);letter-spacing:.06em}
  .rp-stat.good b{color:var(--good)}.rp-stat.bad b{color:var(--bad)}.rp-stat.rate b{color:var(--brand)}
  .rp-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .rp-grid2 .rp-card{margin-bottom:0}
  .rp-grid2{margin-bottom:14px}
  .rp-bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
  .rp-bar span{display:block;height:100%;width:0;background:var(--brand);border-radius:999px;transition:width .4s}
  .rp-prog-row{display:flex;align-items:center;gap:12px}
  .rp-prog-row .rp-bar{flex:1}
  .rp-prog-row .pct{font-family:var(--serif);font-weight:700;font-size:1.05rem;color:var(--brand);font-variant-numeric:tabular-nums;white-space:nowrap}
  .rp-prog-note{color:var(--dim);font-size:.82rem;margin-top:8px;font-variant-numeric:tabular-nums}
  .rp-ck{display:flex;gap:10px}
  .rp-ck .rp-stat{flex:1}
  .rp-chap-row{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
  .rp-chap-row:last-child{border-bottom:0;padding-bottom:0}
  .rp-chap-row .nm{font-weight:600;font-size:.92rem}
  .rp-chap-row .ct{color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rp-chap-row .rp-bar{grid-column:1 / -1;height:4px}
  .rp-empty-hint{color:var(--dim);font-size:.85rem;background:color-mix(in srgb,var(--card) 55%,var(--bg));border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-top:6px}
  @media(max-width:640px){.rp-stats{grid-template-columns:repeat(2,1fr)}.rp-stat:last-child{grid-column:span 2}}
  @media(max-width:520px){.rp-grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="index.html"><span class="m"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span> EngHub</a>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">首页</a>
    <a href="dashboard.html?exam=cet4" data-exam="cet4">四级</a>
    <a href="dashboard.html?exam=cet6" data-exam="cet6">六级</a>
    <a href="dashboard.html?exam=ielts" data-exam="ielts">雅思</a>
  </nav>
  <div class="nav-right">
    <div class="nav-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> <input placeholder="搜单词 / 题目…" /></div>
    <button class="btn-login">登录</button>
  </div>
  <button class="nav-toggle" id="navToggle">☰</button>
</header>

<div class="rp-wrap">
  <div class="rp-head">
    <h1>学习报告</h1>
    <p class="sub">数据全部来自你的真实学习记录</p>
  </div>

  <div class="pp-tabs" id="rpTabs"></div>

  <div class="rp-card">
    <h3><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>概览统计</h3>
    <div class="rp-stats">
      <div class="rp-stat"><b id="stTotal">—</b><span>词库总词数</span></div>
      <div class="rp-stat"><b id="stMarked">0</b><span>已背</span></div>
      <div class="rp-stat good"><b id="stKnown">0</b><span>认识</span></div>
      <div class="rp-stat bad"><b id="stUnknown">0</b><span>生词</span></div>
      <div class="rp-stat rate"><b id="stRate">—</b><span>掌握率</span></div>
    </div>
  </div>

  <div class="rp-grid2">
    <div class="rp-card">
      <h3><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>词库总进度</h3>
      <div class="rp-prog-row">
        <div class="rp-bar"><span id="pgFill"></span></div>
        <span class="pct" id="pgPct">—</span>
      </div>
      <p class="rp-prog-note" id="pgNote">已认识 — / 词库 —</p>
    </div>
    <div class="rp-card">
      <h3><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>打卡概览</h3>
      <div class="rp-ck">
        <div class="rp-stat"><b id="ckTotal">0</b><span>总打卡天数</span></div>
        <div class="rp-stat rate"><b id="ckStreak">0</b><span>当前连续</span></div>
      </div>
    </div>
  </div>

  <div class="rp-card" id="rpChap" style="display:none">
    <h3><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>章节掌握明细</h3>
    <div id="chapList"></div>
  </div>
</div>

<footer class="foot">EngHub · 学习报告</footer>
<script src="assets/app.js"></script>
<script src="assets/cloud-auth.js"></script>
<script>
(function(){
  var EXAMS=[["cet4","四级"],["cet6","六级"],["ielts","雅思"]];
  var cur="ielts";
  try{ var e=localStorage.getItem("engapp-exam"); if(e==="cet4"||e==="cet6"||e==="ielts") cur=e; }catch(err){}

  // ===== 真实数据读取 =====
  function stats(exam){
    var k=0,u=0;
    try{
      var r=JSON.parse(localStorage.getItem("study-"+exam+"-results")||"{}");
      for(var w in r){ if(r[w]==="known")k++; else if(r[w]==="unknown")u++; }
    }catch(err){}
    return {k:k,u:u};
  }
  function results(exam){
    try{ return JSON.parse(localStorage.getItem("study-"+exam+"-results")||"{}"); }catch(err){ return {}; }
  }
  function checkins(){
    try{
      var a=JSON.parse(localStorage.getItem("engapp-checkin")||"[]");
      if(!Array.isArray(a)) return [];
      return a.filter(function(d,i){ return typeof d==="string" && a.indexOf(d)===i; });
    }catch(err){ return []; }
  }

  // ===== 词库脚本按需注入（切换时移除旧脚本防串数据） =====
  var deckScript=null, loadedDeck=null, loadedExam=null;
  function loadDeck(exam){
    if(deckScript && deckScript.parentNode) deckScript.parentNode.removeChild(deckScript);
    deckScript=null; loadedDeck=null; loadedExam=null;
    try{ window.DECK=undefined; }catch(err){}
    document.getElementById("rpChap").style.display="none";
    var s=document.createElement("script");
    s.src="data/"+exam+".js";
    s.onload=function(){
      if(exam!==cur) return; // 已切走,丢弃
      if(window.DECK && Object.prototype.toString.call(window.DECK)==="[object Array]" && window.DECK.length){
        loadedDeck=window.DECK; loadedExam=exam;
        renderOverview(); renderChapters();
      }
    };
    s.onerror=function(){ /* 加载失败:章节区保持隐藏,概览退回 localStorage 词库数 */ };
    document.body.appendChild(s);
    deckScript=s;
  }

  function deckTotal(exam){
    if(loadedDeck && loadedExam===exam) return loadedDeck.length;
    var n=0;
    try{ n=parseInt(localStorage.getItem("engapp-decksize-"+exam),10)||0; }catch(err){}
    return n;
  }

  // ===== 渲染 =====
  function renderOverview(){
    var st=stats(cur), marked=st.k+st.u, total=deckTotal(cur);
    document.getElementById("stTotal").textContent= total? String(total) : "—";
    document.getElementById("stMarked").textContent=String(marked);
    document.getElementById("stKnown").textContent=String(st.k);
    document.getElementById("stUnknown").textContent=String(st.u);
    document.getElementById("stRate").textContent= marked? Math.round(st.k/marked*100)+"%" : "—";
    var pct= total? Math.min(100,Math.round(st.k/total*100)) : 0;
    document.getElementById("pgFill").style.width=(total?pct:0)+"%";
    document.getElementById("pgPct").textContent= total? pct+"%" : "—";
    document.getElementById("pgNote").textContent= total
      ? ("已认识 "+st.k+" / 词库 "+total+" 词")
      : "词库数据未加载,先去背几个词吧";
  }

  function renderCheckin(){
    var ck=checkins();
    document.getElementById("ckTotal").textContent=String(ck.length);
    var pad=function(n){ return String(n).padStart(2,"0"); };
    var dstr=function(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
    var d=new Date();
    if(ck.indexOf(dstr(d))<0) d.setDate(d.getDate()-1); // 今天还没打卡,从昨天起算
    var s=0;
    while(ck.indexOf(dstr(d))>=0){ s++; d.setDate(d.getDate()-1); }
    document.getElementById("ckStreak").textContent=String(s);
  }

  function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function renderChapters(){
    var box=document.getElementById("rpChap"), list=document.getElementById("chapList");
    if(!loadedDeck || loadedExam!==cur){ box.style.display="none"; return; }
    var res=results(cur);
    var groups=[], idx={};
    loadedDeck.forEach(function(it){
      var u=(it&&it.u)||"未分组";
      if(!(u in idx)){ idx[u]=groups.length; groups.push({name:u,total:0,known:0}); }
      var g=groups[idx[u]];
      g.total++;
      if(it && res[it.w]==="known") g.known++;
    });
    if(groups.length<2){ box.style.display="none"; return; } // 只有一个分组:优雅降级
    list.innerHTML=groups.map(function(g){
      var p=g.total? Math.round(g.known/g.total*100) : 0;
      return '<div class="rp-chap-row"><span class="nm">'+esc(g.name)+'</span><span class="ct">'+g.known+' / '+g.total+'</span><div class="rp-bar"><span style="width:'+p+'%"></span></div></div>';
    }).join("");
    box.style.display="";
  }

  // ===== 考试切换 tab =====
  var tabs=document.getElementById("rpTabs");
  tabs.innerHTML=EXAMS.map(function(x){
    return '<button class="pp-tab" data-exam="'+x[0]+'">'+x[1]+'</button>';
  }).join("");
  function markTabs(){
    tabs.querySelectorAll(".pp-tab").forEach(function(b){ b.classList.toggle("on", b.dataset.exam===cur); });
  }
  tabs.addEventListener("click",function(e){
    var b=e.target.closest(".pp-tab");
    if(!b || b.dataset.exam===cur) return;
    cur=b.dataset.exam;
    markTabs();
    renderOverview();
    loadDeck(cur);
  });

  function renderAll(){ renderOverview(); renderCheckin(); renderChapters(); }

  // 登录拉取云端数据后重渲染（本页非备考中心,直接覆盖 onLogin）
  if(window.CloudAuth) CloudAuth.onLogin=function(){ renderAll(); };

  markTabs();
  renderAll();
  loadDeck(cur);
  setTimeout(renderAll,1200); // 等云端 syncDown 合并后再刷新一次
})();
</script>
</body>
</html>
