<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<title>我的笔记 · EngHub</title>
<script>try{var t=localStorage.getItem('engapp-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="stylesheet" href="assets/style.css" />
<style>
  .nb-wrap{max-width:880px;margin:0 auto;padding:24px clamp(16px,4vw,24px) 60px}
  .nb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .nb-head h1{font-size:clamp(1.4rem,3.4vw,2rem);font-weight:800}
  .nb-head .sub{color:var(--dim);margin-top:4px}
  .nb-editor{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
  .nb-editor textarea{width:100%;min-height:120px;resize:vertical;border:0;outline:none;background:none;color:var(--ink);font-size:1rem;line-height:1.7;font-family:inherit}
  .nb-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .nb-bar .hint{color:var(--dim);font-size:.82rem}
  .nb-save{border:0;cursor:pointer;padding:9px 22px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:700}
  .nb-save:disabled{opacity:.5;cursor:default}
  .nb-list{margin-top:22px;display:grid;gap:14px}
  .nb-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;position:relative}
  .nb-card .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--dim);font-size:.78rem;margin-bottom:8px}
  .nb-card .body{white-space:pre-wrap;word-break:break-word;line-height:1.7}
  .nb-del{border:0;background:none;color:var(--dim);cursor:pointer;font-size:.82rem;font-weight:700}
  .nb-del:hover{color:#ef4444}
  .nb-empty{text-align:center;color:var(--dim);padding:46px 20px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
  .nb-login{text-align:center;color:var(--dim);background:color-mix(in srgb,var(--brand) 7%,var(--card));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px;font-size:.9rem}
  .nb-login b{color:var(--brand);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="index.html"><span class="m">📚</span> EngHub</a>
  <nav class="nav-links" id="navLinks">
    <a href="index.html">首页</a>
    <a href="dashboard.html?exam=cet4" data-exam="cet4">四级</a>
    <a href="dashboard.html?exam=cet6" data-exam="cet6">六级</a>
    <a href="dashboard.html?exam=ielts" data-exam="ielts">雅思</a>
  </nav>
  <div class="nav-right">
    <div class="nav-search">🔍 <input placeholder="搜单词 / 题目…" /></div>
    <button class="btn-login">登录</button>
  </div>
  <button class="nav-toggle" id="navToggle">☰</button>
</header>

<div class="nb-wrap">
  <div class="nb-head">
    <div><h1>📒 我的笔记</h1><p class="sub">随手记考点、好句、易错点 —— 登录后自动云端保存，换设备也在。</p></div>
    <span class="badge" id="noteCount"></span>
  </div>

  <div class="nb-login" id="loginTip" style="display:none">还没登录，笔记只存在这台设备。<b id="tipLogin">点此登录</b> 后即可云端同步。</div>

  <div class="nb-editor">
    <textarea id="editor" placeholder="写点什么…例：be supposed to 表示“理应/被期望”，常用于口语。"></textarea>
    <div class="nb-bar">
      <span class="hint" id="saveHint"></span>
      <button class="nb-save" id="saveBtn">保存笔记</button>
    </div>
  </div>

  <div class="nb-list" id="list"></div>
</div>

<footer class="foot">EngHub · 我的笔记</footer>
<script src="assets/app.js"></script>
<script src="assets/cloud-auth.js"></script>
<script>
(function(){
  var KEY="engapp-notes";
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ return []; } }
  function save(arr){ localStorage.setItem(KEY, JSON.stringify(arr)); if(window.CloudAuth&&CloudAuth.isLoggedIn()) CloudAuth.syncUp(); }
  function fmt(ts){ var d=new Date(ts); return (d.getMonth()+1)+"月"+d.getDate()+"日 "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

  var listEl=document.getElementById("list"), cntEl=document.getElementById("noteCount");
  function render(){
    var arr=load();
    cntEl.textContent=arr.length+" 条";
    if(!arr.length){ listEl.innerHTML='<div class="nb-empty">还没有笔记，写下第一条吧 ✍️</div>'; return; }
    listEl.innerHTML=arr.map(function(n){
      return '<div class="nb-card"><div class="meta"><span>'+fmt(n.ts)+'</span><button class="nb-del" data-id="'+n.id+'">删除</button></div>'+
        '<div class="body">'+String(n.text).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</div></div>';
    }).join("");
    listEl.querySelectorAll(".nb-del").forEach(function(b){ b.onclick=function(){ var arr=load().filter(function(x){return String(x.id)!==b.dataset.id;}); save(arr); render(); }; });
  }

  document.getElementById("saveBtn").onclick=function(){
    var t=document.getElementById("editor").value.trim(); if(!t) return;
    var arr=load(); arr.unshift({ id: Date.now()+""+Math.floor(Math.random()*1000), text:t, ts:Date.now() }); save(arr);
    document.getElementById("editor").value="";
    var h=document.getElementById("saveHint"); h.textContent="已保存 ✓"; setTimeout(function(){h.textContent="";},1500);
    render();
  };

  function refreshTip(){
    var inLogin=window.CloudAuth&&CloudAuth.isLoggedIn();
    document.getElementById("loginTip").style.display=inLogin?"none":"block";
  }
  var tl=document.getElementById("tipLogin"); if(tl) tl.onclick=function(){ if(window.CloudAuth) CloudAuth.open(); };
  // 登录后云端数据会写入本地，刷新列表
  if(window.CloudAuth) CloudAuth.onLogin=function(){ render(); refreshTip(); };
  refreshTip(); render();
  // 登录态下，cloud-auth 在页面加载时会 syncDown 合并云端数据，稍后再渲染一次
  setTimeout(render, 1200);
})();
</script>
</body>
</html>
