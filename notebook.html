<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#caa86a" />
<title>EngHub · 概念六 纸张笔记本</title>
<style>
:root{
  --desk:#d8c9a8; --paper:#fbf7ec; --ink:#2c3a52; --ink-soft:#5b6a82; --red:#d4756b;
  --rule:#cfe0f2; --tape:rgba(255,210,120,.6); --accent:#3b6ea5; --hl:#ffe27a; --ring:#b39b70;
  --hand:"Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE","Kaiti SC","STKaiti","KaiTi","楷体",cursive;
  --shadow:0 20px 55px rgba(70,52,20,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;
  color:var(--ink); min-height:100vh; line-height:1.7; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1000px 700px at 50% -10%, #e7dcc1, transparent 60%),
    repeating-linear-gradient(45deg,#d8c9a8 0 22px,#d3c3a1 22px 44px);
  padding:34px 16px 80px;
}
a{text-decoration:none;color:inherit}
.hand{font-family:var(--hand)}
.hl{background:linear-gradient(transparent 58%, var(--hl) 58%); padding:0 2px;}

/* 笔记本 */
.book{
  position:relative; max-width:940px; margin:0 auto; background-color:var(--paper);
  background-image:repeating-linear-gradient(var(--paper) 0 33px, var(--rule) 33px 34px);
  background-position:0 70px;
  border-radius:6px; box-shadow:var(--shadow); padding:54px 38px 58px 78px;
}
/* 左侧红色边线 */
.book::before{content:"";position:absolute;left:58px;top:0;bottom:0;width:2px;background:var(--red);opacity:.55}
/* 顶部螺旋线圈 */
.spiral{position:absolute;top:-12px;left:0;right:0;height:24px;
  background-image:radial-gradient(circle 11px at 14px 12px, transparent 0 8px, var(--ring) 8px 11px, transparent 11px);
  background-size:42px 24px; background-repeat:repeat-x; background-position:center;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.15));}

/* 头部 */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title{font-size:clamp(2rem,6vw,3rem);font-weight:800}
.title .u{position:relative}
.title .u::after{content:"";position:absolute;left:-2px;right:-6px;bottom:-6px;height:7px;border-radius:6px;
  background:var(--red);opacity:.55;transform:rotate(-1deg)}
.sub{color:var(--ink-soft);font-size:1.15rem;margin-top:10px}
.stamp{font-size:1rem;color:var(--red);border:2px solid var(--red);border-radius:8px;padding:4px 12px;
  transform:rotate(6deg);opacity:.7;font-weight:700;white-space:nowrap}

/* 考试标签（折角便签） */
.tabs{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.tab{position:relative;font-family:var(--hand);font-weight:700;font-size:1.25rem;color:#fff;
  padding:14px 22px;border-radius:4px;box-shadow:3px 5px 12px rgba(0,0,0,.16);cursor:pointer;transition:transform .12s}
.tab:hover{transform:translateY(-3px) rotate(0)}
.tab.t4{background:#5b86c7;transform:rotate(-2deg)}
.tab.t6{background:#8b6fc0;transform:rotate(1.5deg)}
.tab.ti{background:#cf7a55;transform:rotate(-1deg)}

/* 今日单词条目 */
.entry{margin-top:34px;font-family:var(--hand)}
.entry .lab{font-size:1.05rem;color:var(--ink-soft)}
.entry .word{font-size:clamp(2.4rem,7vw,3.4rem);font-weight:800;display:inline-flex;align-items:center;gap:14px}
.play{width:46px;height:46px;border-radius:50%;border:2px dashed var(--accent);background:transparent;color:var(--accent);
  font-size:1.1rem;cursor:pointer;font-family:inherit}
.play:hover{background:var(--accent);color:#fff;border-style:solid}
.entry .ph{color:var(--accent);font-size:1.3rem;margin-top:2px}
.entry .mn{font-size:1.45rem;margin-top:8px}

/* 两栏：任务清单 + 便利贴 */
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;margin-top:40px}
.section-t{font-family:var(--hand);font-size:1.5rem;font-weight:800;margin-bottom:10px}
.todo{list-style:none}
.todo li{display:flex;align-items:center;gap:12px;font-family:var(--hand);font-size:1.3rem;padding:7px 0;cursor:pointer;user-select:none}
.box{width:24px;height:24px;flex:none;border:2.5px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-size:1rem;color:var(--accent)}
.todo li.done .box::after{content:"✓"}
.todo li.done .tx{text-decoration:line-through;color:var(--ink-soft);text-decoration-color:var(--red)}

.notes{display:flex;flex-wrap:wrap;gap:18px;align-content:flex-start}
.note{position:relative;width:135px;min-height:120px;padding:16px 14px;border-radius:2px;
  box-shadow:3px 6px 14px rgba(0,0,0,.16);font-family:var(--hand)}
.note::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-3deg);
  width:64px;height:20px;background:var(--tape);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note .n{font-size:2rem;font-weight:800}
.note .l{color:#5b5230}
.n1{background:#fff3a8;transform:rotate(-3deg)}
.n2{background:#bde6c4;transform:rotate(2deg)}
.n3{background:#bfe0f5;transform:rotate(-1.5deg)}

/* 模块 手写清单 */
.mods{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px;font-family:var(--hand);font-size:1.25rem}
.mods span{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.mods span:hover{color:var(--accent)}

.foot{text-align:center;color:#7a6d4f;font-family:var(--hand);font-size:1.05rem;margin-top:30px}

.layout-switch{position:fixed;left:16px;bottom:16px;z-index:9998;display:flex;align-items:center;gap:4px;
  background:rgba(40,30,15,.9);backdrop-filter:blur(8px);color:#fff;padding:6px 10px;border-radius:999px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:.8rem}
.layout-switch .lbl{opacity:.7;margin-right:4px;font-size:.72rem}
.layout-switch a{padding:4px 10px;border-radius:999px;color:#fff;font-weight:700}
.layout-switch a.cur{background:#fff;color:#111}

@media(max-width:720px){
  .book{padding:50px 22px 50px 60px}
  .book::before{left:42px}
  .cols{grid-template-columns:1fr;gap:30px}
}
</style>
</head>
<body>
<div class="book">
  <div class="spiral"></div>

  <div class="head">
    <div>
      <h1 class="title hand">📒 English <span class="u">学习笔记</span></h1>
      <p class="sub hand">四级 · 六级 · 雅思 —— 像翻一本单词本一样学英语 ✍️</p>
    </div>
    <div class="stamp hand">DAY 7 ✓</div>
  </div>

  <div class="tabs">
    <div class="tab t4">📘 四级</div>
    <div class="tab t6">📗 六级</div>
    <div class="tab ti">📕 雅思</div>
  </div>

  <div class="entry">
    <div class="lab">✎ 今日单词</div>
    <div class="word">resilient <button class="play" id="playBtn" title="发音">🔊</button></div>
    <div class="ph">/rɪˈzɪliənt/　adj.</div>
    <div class="mn">有韧性的；<span class="hl">适应力强的</span>；可迅速恢复的</div>
  </div>

  <div class="cols">
    <div>
      <div class="section-t">✅ 今日任务</div>
      <ul class="todo" id="todo">
        <li class="done"><span class="box"></span><span class="tx">复习昨日 20 词</span></li>
        <li class="done"><span class="box"></span><span class="tx">学习新词 30 个</span></li>
        <li><span class="box"></span><span class="tx">完成一篇阅读题</span></li>
        <li><span class="box"></span><span class="tx">听写训练 10 分钟</span></li>
        <li><span class="box"></span><span class="tx">背一组同义替换</span></li>
      </ul>
      <div class="section-t" style="margin-top:26px">🧩 学习模块</div>
      <div class="mods">
        <span>📕 背单词</span><span>📝 题库</span><span>📖 语法</span>
        <span>✍️ 写作</span><span>🎧 听力</span><span>✅ 测验</span><span>⭐ 收藏</span>
      </div>
    </div>

    <div>
      <div class="section-t">📌 我的小本本</div>
      <div class="notes">
        <div class="note n1"><div class="n">🔥 7</div><div class="l">连续打卡天数</div></div>
        <div class="note n2"><div class="n">62%</div><div class="l">今日进度</div></div>
        <div class="note n3"><div class="n">1750</div><div class="l">已掌握词数</div></div>
      </div>
    </div>
  </div>

  <div class="foot hand">—— 翻到下一页，继续加油 ——</div>
</div>

<!-- 旧概念切换条已移除；并入主项目时统一加返回/导航 -->

<script>
document.getElementById('todo').addEventListener('click', e=>{
  const li = e.target.closest('li'); if(li) li.classList.toggle('done');
});
document.getElementById('playBtn').addEventListener('click', ()=>{
  const a = new Audio('https://dict.youdao.com/dictvoice?type=2&audio=resilient');
  a.play().catch(()=>{ if(window.speechSynthesis){const u=new SpeechSynthesisUtterance('resilient');u.lang='en-US';speechSynthesis.speak(u);} });
});
</script>
</body>
</html>
