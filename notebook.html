<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#d8cdb0" />
<title>我的笔记 · EngHub</title>
<script>try{var t=localStorage.getItem('engapp-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{
  --paper:#fbf7ec; --ink:#3a3427; --ink-soft:#6f6552; --red:#c05f45;
  --rule:#cfdbe8; --accent:#31584a; --ring:#b39b70;
  --hand:"Segoe Print","Bradley Hand","Comic Sans MS","Chalkboard SE","Kaiti SC","STKaiti","KaiTi","楷体",cursive;
  --shadow:0 20px 55px rgba(70,52,20,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;color:var(--ink);min-height:100vh;line-height:1.7;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1000px 700px at 50% -10%, #ece3cd, transparent 60%),repeating-linear-gradient(45deg,#ded3b9 0 22px,#d8cdb0 22px 44px);padding:34px 16px 80px;}
a{text-decoration:none;color:inherit}
.hand{font-family:var(--hand)}

.book{position:relative;max-width:940px;margin:0 auto;background:var(--paper);border-radius:6px;box-shadow:var(--shadow);padding:54px 38px 40px 78px;}
.book::before{content:"";position:absolute;left:58px;top:0;bottom:0;width:2px;background:var(--red);opacity:.55}
.spiral{position:absolute;top:-12px;left:0;right:0;height:24px;
  background-image:radial-gradient(circle 11px at 14px 12px, transparent 0 8px, var(--ring) 8px 11px, transparent 11px);
  background-size:42px 24px;background-repeat:repeat-x;background-position:center;filter:drop-shadow(0 2px 1px rgba(0,0,0,.15));}

.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title{font-size:clamp(2rem,6vw,3rem);font-weight:800}
.title .u{position:relative}
.title .u::after{content:"";position:absolute;left:-2px;right:-6px;bottom:-6px;height:7px;border-radius:6px;background:var(--red);opacity:.55;transform:rotate(-1deg)}
.sub{color:var(--ink-soft);font-size:1.1rem;margin-top:10px}
.topbar{display:flex;align-items:center;gap:10px;font-family:var(--hand)}
.topbar a.home{color:var(--accent);font-size:1.05rem}
.btn-login{font-family:var(--hand);font-size:1.05rem;color:#fff;background:var(--accent);border:0;cursor:pointer;padding:8px 16px;border-radius:6px;box-shadow:3px 4px 10px rgba(0,0,0,.16);transform:rotate(-1.5deg)}
.btn-login:hover{transform:rotate(0)}

.tabs{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.tab{font-family:var(--hand);font-weight:700;font-size:1.2rem;color:#fff;padding:12px 20px;border:0;border-radius:4px;box-shadow:3px 5px 12px rgba(0,0,0,.16);cursor:pointer;transition:transform .12s,opacity .12s;opacity:.78}
.tab.t4{background:#4f6b9b;transform:rotate(-2deg)} .tab.t6{background:#7a5474;transform:rotate(1.5deg)} .tab.ti{background:#bb5f36;transform:rotate(-1deg)}
.tab:hover{opacity:1;transform:translateY(-2px) rotate(0)}
.tab.on{opacity:1;transform:translateY(-3px) rotate(0) scale(1.04);box-shadow:0 8px 20px rgba(0,0,0,.25);outline:3px solid rgba(255,255,255,.7)}

.pagelab{font-family:var(--hand);font-size:1.2rem;color:var(--ink-soft);margin:26px 0 4px;display:flex;align-items:center;gap:8px}
/* 一页横线纸，自由书写 */
.page{display:block;width:100%;min-height:510px;border:0;outline:none;resize:none;background:transparent;
  font-family:var(--hand);font-size:1.32rem;line-height:34px;color:var(--ink);padding:0 12px 0 26px;
  background-image:repeating-linear-gradient(transparent 0 33px, var(--rule) 33px 34px);background-attachment:local;}
.page::placeholder{color:rgba(91,106,130,.55)}

.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;font-family:var(--hand);flex-wrap:wrap}
.pager button{font-family:var(--hand);font-size:1.05rem;color:var(--accent);background:rgba(255,255,255,.55);border:1.5px solid rgba(80,60,30,.2);border-radius:8px;padding:7px 16px;cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
.pager .info{color:var(--ink-soft);min-width:90px;text-align:center}
.pager .add{color:#fff;background:var(--red);border-color:var(--red)}
.pager .del{color:var(--ink-soft)}
.savetip{font-family:var(--hand);color:#3a9; font-size:.95rem;min-width:60px}

.foot{text-align:center;color:#7a6d4f;font-family:var(--hand);font-size:1.05rem;margin-top:22px}
@media(max-width:720px){ .book{padding:50px 18px 36px 56px} .book::before{left:40px} }
</style>
</head>
<body>
<div class="book">
  <div class="spiral"></div>

  <div class="head">
    <div>
      <h1 class="title hand">English <span class="u">学习笔记</span></h1>
      <p class="sub hand">像在本子上一样随手写 —— 登录后自动云端保存，换设备也在</p>
    </div>
    <div class="topbar">
      <a class="home" href="index.html">← 首页</a>
      <button class="btn-login">登录</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab t4" data-exam="cet4">四级</button>
    <button class="tab t6" data-exam="cet6">六级</button>
    <button class="tab ti" data-exam="ielts">雅思</button>
  </div>

  <div class="pagelab"><span id="nbName">四级</span> 笔记本 · 第 <span id="pNo">1</span> / <span id="pTot">1</span> 页 <span class="savetip" id="savetip"></span></div>
  <textarea class="page hand" id="page" placeholder="在这一页随便写……单词、长句、考点、心得都行。写满就翻到下一页～"></textarea>

  <div class="pager">
    <button id="prev">‹ 上一页</button>
    <span class="info" id="info">第 1 / 1 页</span>
    <button id="next">下一页 ›</button>
    <button class="add" id="add">＋ 新一页</button>
    <button class="del" id="del">删本页</button>
  </div>

  <div class="foot">—— 一页页写满，就是进步 ——</div>
</div>

<script src="assets/app.js"></script>
<script src="assets/cloud-auth.js"></script>
<script>
(function(){
  var KEY="engapp-notes";   // { cet4:[页内容...], cet6:[...], ielts:[...], _at }
  var LABEL={cet4:"四级",cet6:"六级",ielts:"雅思"};
  var cur=localStorage.getItem("engapp-exam"); var q=new URLSearchParams(location.search).get("exam");
  if(LABEL[q]) cur=q; if(!LABEL[cur]) cur="cet4";
  var idxMap={cet4:0,cet6:0,ielts:0};

  function obj(){ try{ var o=JSON.parse(localStorage.getItem(KEY)||"{}"); return (o&&typeof o==="object"&&!Array.isArray(o))?o:{}; }catch(e){ return {}; } }
  function pages(ex){ var a=obj()[ex]; return (a&&a.length)?a:[""]; }
  function persist(text){ var o=obj(); var a=(o[cur]&&o[cur].length)?o[cur].slice():[""]; a[idxMap[cur]]=text; o[cur]=a; o._at=Date.now(); localStorage.setItem(KEY,JSON.stringify(o)); if(window.CloudAuth&&CloudAuth.isLoggedIn()) CloudAuth.syncUp(); }

  var ta=document.getElementById("page"), info=document.getElementById("info"),
      pNo=document.getElementById("pNo"), pTot=document.getElementById("pTot"), tip=document.getElementById("savetip");

  function show(){
    var ps=pages(cur), i=idxMap[cur]; if(i>=ps.length) i=ps.length-1; if(i<0)i=0; idxMap[cur]=i;
    ta.value=ps[i]||"";
    document.getElementById("nbName").textContent=LABEL[cur];
    pNo.textContent=i+1; pTot.textContent=ps.length; info.textContent="第 "+(i+1)+" / "+ps.length+" 页";
    document.getElementById("prev").disabled=i<=0;
    document.getElementById("next").disabled=i>=ps.length-1;
    [].forEach.call(document.querySelectorAll(".tab"), function(b){ b.classList.toggle("on", b.dataset.exam===cur); });
  }

  var timer;
  ta.addEventListener("input", function(){ clearTimeout(timer); timer=setTimeout(function(){ persist(ta.value); tip.textContent="已保存 ✓"; setTimeout(function(){tip.textContent="";},1200); }, 500); });
  ta.addEventListener("blur", function(){ persist(ta.value); });
  window.addEventListener("pagehide", function(){ persist(ta.value); });

  document.querySelectorAll(".tab").forEach(function(b){ b.onclick=function(){ persist(ta.value); cur=b.dataset.exam; localStorage.setItem("engapp-exam",cur); show(); }; });
  document.getElementById("prev").onclick=function(){ persist(ta.value); if(idxMap[cur]>0){ idxMap[cur]--; show(); } };
  document.getElementById("next").onclick=function(){ persist(ta.value); if(idxMap[cur]<pages(cur).length-1){ idxMap[cur]++; show(); } };
  document.getElementById("add").onclick=function(){ persist(ta.value); var o=obj(); var a=(o[cur]&&o[cur].length)?o[cur].slice():[""]; a.push(""); o[cur]=a; o._at=Date.now(); localStorage.setItem(KEY,JSON.stringify(o)); idxMap[cur]=a.length-1; if(window.CloudAuth&&CloudAuth.isLoggedIn())CloudAuth.syncUp(); show(); ta.focus(); };
  document.getElementById("del").onclick=function(){ var ps=pages(cur); if(ps.length<=1){ if(!confirm("清空本页？"))return; } else if(!confirm("删除当前这一页？"))return;
    var o=obj(); var a=(o[cur]&&o[cur].length)?o[cur].slice():[""]; a.splice(idxMap[cur],1); if(!a.length)a=[""]; o[cur]=a; o._at=Date.now(); localStorage.setItem(KEY,JSON.stringify(o)); if(idxMap[cur]>=a.length)idxMap[cur]=a.length-1; if(window.CloudAuth&&CloudAuth.isLoggedIn())CloudAuth.syncUp(); show(); };

  if(window.CloudAuth) CloudAuth.onLogin=function(){ show(); };
  show(); setTimeout(show,1200);   // 登录后云端笔记合并到本地再刷新
})();
</script>
</body>
</html>
